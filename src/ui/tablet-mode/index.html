<!doctype html>
<html lang="en" data-loading>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>orCAL</title>
    <link rel="stylesheet" href="../vendor/colony/colony-accents.css" />
    <link rel="stylesheet" href="../vendor/colony/colony-themes.css" />
    <link rel="stylesheet" href="../common/base.css" />
    <link rel="stylesheet" href="../common/preferences.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator-app">
      <section class="calculator-frame calculator-tablet-frame">
        <div class="drag-region" data-tauri-drag-region aria-hidden="true"></div>
        <header class="calculator-status" data-tauri-drag-region>
          <div class="status" data-tauri-drag-region>
            <div class="status-time" data-tauri-drag-region aria-live="polite">--:--</div>
            <div class="status-icons" role="group" data-i18n-aria-label="window_controls">
              <button
                class="status-icon-button glyph"
                type="button"
                data-action="switch-layout"
                data-layout="phone"
                data-i18n-aria-label="layout_switch_phone"
                data-i18n-title="layout_switch_phone"
              >&#xf011c;</button>
              <button
                class="status-icon-button glyph"
                type="button"
                data-action="minimize"
                data-i18n-aria-label="window_minimize"
                data-i18n-title="window_minimize"
              >&#xf05b0;</button>
              <button
                class="status-icon-button glyph"
                type="button"
                data-action="close"
                data-i18n-aria-label="window_close"
                data-i18n-title="window_close"
              >&#xf0156;</button>
            </div>
          </div>
          <div class="status-message" role="status" aria-live="polite"></div>
          <button class="status-brand" type="button" data-i18n-title="settings_title">
            orCAL<span class="glyph" aria-hidden="true">&#xf013;</span>
          </button>
        </header>

        <section class="calculator-tablet-body" data-i18n-aria-label="calculator_scientific" data-calculator>
          <div class="calculator-tablet-left">
            <div class="calculator-toolbar">
              <div class="calculator-mode" data-i18n-aria-label="mode_label">
                <span class="mode-pill" aria-hidden="true" data-i18n="mode_scientific"></span>
              </div>
            </div>

            <section class="calculator-screen" aria-live="polite">
              <div class="screen-expression" data-expression></div>
              <div class="screen-result-wrapper">
                <div class="screen-result" data-result>0</div>
                <div class="screen-result-tooltip" data-result-tooltip role="tooltip">0</div>
              </div>
            </section>
          </div>

          <div class="calculator-tablet-right">
            <section class="calculator-keypad" data-i18n-aria-label="keypad_label"></section>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
