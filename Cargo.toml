[package]
name = "orcal"
description = "A small desktop calculator with a phone keypad and a scientific tablet layout"
version = "0.4.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/orCAL"
edition = "2021"
# The floor of tauri 2.12 and tauri-build 2.7. CI's msrv job builds on it.
rust-version = "1.90"

[[bin]]
name = "orCAL"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.7.2"

[dependencies]
dirs = "7.0.0"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Without custom-protocol, a plain `cargo build --release` (what the release
# workflow runs, no tauri-cli) compiles a Tauri development build.
tauri = { version = "2.12.3", features = ["custom-protocol"] }
thiserror = "2.0.21"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
