[package]
name = "orcal-tauri"
version = "0.3.1" # x-release-please-version
license.workspace = true
edition = "2021"

[[bin]]
name = "orCAL"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orcal-core = { path = "../crates/orcal-core" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Without custom-protocol, a plain `cargo build --release` (what the release
# workflow runs, no tauri-cli) compiles a Tauri development build.
tauri = { version = "2", features = ["custom-protocol"] }
