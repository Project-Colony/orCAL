[package]
name = "orcal-tauri"
version = "0.1.3" # x-release-please-version
license.workspace = true
edition = "2021"

[[bin]]
name = "orCAL"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
orcal-core = { path = "../crates/orcal-core" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1", features = ["window-close", "window-minimize", "window-set-size", "window-set-resizable", "window-center", "window-start-dragging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
