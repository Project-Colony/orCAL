name: CI

# The release workflow only builds once release-please has cut a tag, so
# without this a change that broke the build, the lints or the Windows
# version resource was found at release time, on main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to master with `toolchain: stable` rather than to the `stable`
      # branch: that branch is rebased onto every master commit, so a SHA
      # pinned on it stops being reachable from any branch.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-${{ matrix.os }}

      # Same list as the release workflow.
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Check formatting
        run: cargo fmt --check

      # --locked on the first resolving command: a Cargo.lock that disagrees
      # with the manifests (a release that bumped one but not the other) fails
      # here instead of being rewritten silently on the runner.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build

      # Same check as the release workflow's Windows leg: SignPath signs only
      # an .exe whose version resource names the project and carries its
      # version, and tauri-build is what writes it.
      - name: Check the Windows version resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'orcal-tauri' | ForEach-Object version
          $info = (Get-Item target\debug\orCAL.exe).VersionInfo
          "ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)' FileVersion='$($info.FileVersion)'"
          if ($info.ProductName -cne 'orCAL' -or $info.ProductVersion -cne $version) {
            "::error::orCAL.exe has ProductName '$($info.ProductName)' and ProductVersion '$($info.ProductVersion)', expected 'orCAL' and '$version'"
            exit 1
          }

      - name: Test
        run: cargo test
